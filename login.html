<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <!-- Page Metadata and Title -->
    <meta charset="UTF-8">
    <title>Login - Blood Bank</title>
    
    <!-- External CSS Stylesheet Link -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Main Header Section -->
    <header>
        <h1>Blood Bank - Pulse of Life</h1>
        
        <!-- Navigation Menu -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="search.html">Search Blood</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main>
        <h2>Login</h2>
        
        <!-- Login Form -->
        <form action="#" method="POST" onsubmit="return validateLogin()">            <!-- Email Input Field -->
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <!-- Phone Number Input Field (Limited to 10 Digits) -->
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="05xxxxxxxx" maxlength="10" pattern="[0-9]{10}" required>
            </div>

            <!-- Password Input Field -->
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <!-- Submit Button -->
            <button type="submit">Login</button>
        </form>

        <!-- Link to Sign Up Page if the user doesn't have an account -->
        <p style="margin-top: 20px; text-align: center;">
            Don't have an account? <a href="signup.html" style="color: #800020; font-weight: bold; text-decoration: underline;">Sign up here</a>
        </p>
    </main>
    <script src="script.js"></script>
</body>
</html>
