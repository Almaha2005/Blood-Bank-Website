<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <!-- Page Metadata and Title -->
    <meta charset="UTF-8">
    <title>Sign Up - Blood Bank</title>
    
    <!-- External CSS Stylesheet Link -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Main Header Section -->
    <header>
        <h1>Blood Bank - Pulse of Life</h1>
        
        <!-- Navigation Menu -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="search.html">Search Blood</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main>
        <h2>Create New Account</h2>
        
        <!-- Registration Form -->
        <form action="#" method="POST" onsubmit="return validateSignup()">            <!-- Full Name Input Field -->
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </div>

            <!-- Email Input Field -->
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            </div>

            <!-- Phone Number Input Field (Limited to 10 Digits) -->
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="05xxxxxxxx" maxlength="10" pattern="[0-9]{10}" required>
            </div>

            <!-- Blood Type Selection Dropdown -->
            <div class="form-group">
                <label for="blood-type">Blood Type:</label>
                <select id="blood-type" name="blood_type">
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>

            <!-- Password Input Field -->
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <!-- Submit Button -->
            <button type="submit">Sign Up</button>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
