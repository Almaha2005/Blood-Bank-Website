<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <!-- Page Metadata and Title -->
    <meta charset="UTF-8">
    <title>Search Blood - Blood Bank</title>
    
    <!-- External CSS Stylesheet Link -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Main Header Section -->
    <header>
        <h1>Blood Bank - Pulse of Life</h1>
        
        <!-- Navigation Menu -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="search.html">Search Blood</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main>
        <h2>Search for Blood Donor</h2>
        
        <!-- Search Form -->
           <form action="#" method="GET" onsubmit="return searchDonor()">            <!-- Blood Type Selection Dropdown -->
            <div class="form-group">
                <label for="search-blood">Select Required Blood Type:</label>
                <select id="search-blood" name="search_blood">
                    <option value="">
                      Select Blood Type
                    </option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>

            <!-- City Input Field -->
            <div class="form-group">
                <label for="city">City:</label>
                <input type="text" id="city" name="city" placeholder="Enter city (e.g. Jeddah)">
            </div>

            <!-- Search Submit Button -->
            <button type="submit">Search</button>
          <p id="searchResult"></p>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
